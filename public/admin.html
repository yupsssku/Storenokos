<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - NokosStore</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#080810;--surface:#0e0e1c;--card:#12122a;--card2:#0f0f20;
      --border:rgba(99,102,241,0.15);--border2:rgba(99,102,241,0.08);
      --primary:#6366f1;--primary-light:#818cf8;
      --text:#f1f5f9;--muted:#64748b;--success:#10b981;--danger:#ef4444;--warn:#f59e0b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
    .glow{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.08),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px;width:100%;max-width:400px;position:relative;z-index:1;}
    .logo{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:6px;}
    .logo span{color:var(--primary);}
    .subtitle{color:var(--muted);font-size:.875rem;margin-bottom:28px;}
    input[type=password]{width:100%;padding:13px 15px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.95rem;outline:none;transition:all .2s;font-family:'DM Sans',sans-serif;margin-bottom:12px;}
    input[type=password]:focus{border-color:var(--primary);}
    input[type=password]::placeholder{color:var(--muted);}
    input[type=text],input[type=number]{width:100%;padding:11px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:.88rem;outline:none;font-family:'DM Sans',sans-serif;transition:all .2s;}
    input[type=text]:focus,input[type=number]:focus{border-color:var(--primary);}
    input[type=text]::placeholder,input[type=number]::placeholder{color:var(--muted);}
    .btn{padding:13px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;width:100%;}
    .btn:hover{background:var(--primary-light);}
    .btn-sm{padding:7px 14px;font-size:.78rem;font-weight:600;border:none;border-radius:7px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;}
    .btn-danger{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.25);}
    .btn-danger:hover{background:rgba(239,68,68,0.2);}
    .btn-add{background:var(--primary);color:#fff;}
    .btn-add:hover{background:var(--primary-light);}
    .msg{padding:10px 14px;border-radius:8px;margin-top:10px;font-size:.85rem;display:none;}
    .msg.error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171;}

    nav{background:rgba(8,8,16,0.92);backdrop-filter:blur(20px);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
    .nav-logo{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;}
    .nav-logo span{color:var(--primary);}
    .btn-nav-out{padding:7px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:.82rem;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif;}
    .btn-nav-out:hover{border-color:var(--danger);color:var(--danger);}

    .container{max-width:1080px;margin:0 auto;padding:28px 16px;}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px;}
    .stat-box{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:20px;}
    .stat-box .s-num{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;color:var(--primary-light);margin-bottom:4px;}
    .stat-box .s-lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

    .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:4px;margin-bottom:20px;}
    .tab{flex:1;padding:9px;text-align:center;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'DM Sans',sans-serif;}
    .tab.active{background:var(--primary);color:#fff;font-weight:600;}

    .panel{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:22px;margin-bottom:16px;}
    .panel-title{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;margin-bottom:18px;color:var(--primary-light);}

    .topup-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .topup-row input{flex:1;min-width:120px;}
    .msg-panel{padding:10px 14px;border-radius:8px;margin-top:10px;font-size:.85rem;display:none;}
    .msg-panel.success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#34d399;}
    .msg-panel.error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171;}

    .table-wrap{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:.82rem;}
    th{background:var(--card2);padding:10px 12px;text-align:left;color:var(--primary-light);border-bottom:1px solid var(--border2);white-space:nowrap;}
    td{padding:10px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(99,102,241,0.03);}

    .badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600;}
    .badge-s{background:rgba(16,185,129,0.1);color:#34d399;border:1px solid rgba(16,185,129,0.2);}
    .badge-p{background:rgba(245,158,11,0.1);color:#fbbf24;border:1px solid rgba(245,158,11,0.2);}
    .badge-c{background:rgba(239,68,68,0.08);color:#f87171;border:1px solid rgba(239,68,68,0.2);}
    .badge-dep{background:rgba(6,182,212,0.1);color:#22d3ee;border:1px solid rgba(6,182,212,0.2);}
    .badge-nokos{background:rgba(99,102,241,0.1);color:var(--primary-light);border:1px solid rgba(99,102,241,0.2);}

    .empty{text-align:center;padding:30px;color:var(--muted);font-size:.875rem;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .login-card{animation:fadeUp .5s ease both;}
    @media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr);}th,td{padding:8px 8px;}}
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-panel">
  <div class="glow"></div>
  <div class="login-card">
    <div class="logo">Nokos<span>Store</span></div>
    <div class="subtitle">Admin Panel · Akses Terbatas</div>
    <input type="password" id="admin-pass" placeholder="Password admin"/>
    <button class="btn" onclick="adminLogin()">Masuk ke Panel</button>
    <div class="msg error" id="msg-login"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="admin-dash" style="display:none">
  <nav>
    <div class="nav-logo">Nokos<span>Store</span> · Admin</div>
    <button class="btn-nav-out" onclick="adminLogout()">Keluar</button>
  </nav>

  <div class="container">
    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-box"><div class="s-num" id="st-users">—</div><div class="s-lbl">Total Member</div></div>
      <div class="stat-box"><div class="s-num" id="st-trx">—</div><div class="s-lbl">Transaksi Sukses</div></div>
      <div class="stat-box"><div class="s-num" id="st-income">—</div><div class="s-lbl">Total Omset</div></div>
      <div class="stat-box"><div class="s-num" id="st-dep">—</div><div class="s-lbl">Total Deposit</div></div>
      <div class="stat-box"><div class="s-num" id="st-bal">—</div><div class="s-lbl">Saldo Beredar</div></div>
      <div class="stat-box"><div class="s-num" id="st-pend">—</div><div class="s-lbl">Transaksi Pending</div></div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="showAdTab('users')">👥 Users</button>
      <button class="tab" onclick="showAdTab('trx')">📋 Transaksi</button>
    </div>

    <!-- USERS -->
    <div id="ad-users">
      <div class="panel">
        <div class="panel-title">Tambah Saldo User</div>
        <div class="topup-row">
          <input type="text" id="tu-user" placeholder="Username"/>
          <input type="number" id="tu-amount" placeholder="Nominal (Rp)"/>
          <button class="btn-sm btn-add" onclick="topupUser()">+ Tambah</button>
        </div>
        <div class="msg-panel" id="msg-topup"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Daftar Member</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Username</th><th>Nama</th><th>Saldo</th><th>HP</th><th>Daftar</th><th>Aksi</th></tr></thead>
            <tbody id="user-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TRX -->
    <div id="ad-trx" style="display:none">
      <div class="panel">
        <div class="panel-title">Transaksi Terbaru (300)</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Order ID</th><th>User</th><th>Tipe</th><th>Nominal</th><th>Status</th><th>Info</th><th>Tanggal</th></tr></thead>
            <tbody id="trx-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let adminKey = '';

function adminLogin() {
  const pass = document.getElementById('admin-pass').value;
  fetch('/api/admin/login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pass})
  }).then(r=>r.json()).then(d=>{
    if(d.success){
      adminKey=pass;
      document.getElementById('login-panel').style.display='none';
      document.getElementById('admin-dash').style.display='block';
      loadStats(); loadUsers();
    } else {
      const m=document.getElementById('msg-login');
      m.textContent='Password salah!'; m.style.display='block';
    }
  });
}

function adminLogout(){
  adminKey='';
  document.getElementById('login-panel').style.display='flex';
  document.getElementById('admin-dash').style.display='none';
}

function showAdTab(t){
  document.getElementById('ad-users').style.display=t==='users'?'block':'none';
  document.getElementById('ad-trx').style.display=t==='trx'?'block':'none';
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['users','trx'][i]===t));
  if(t==='trx') loadTrx();
}

function adPost(url, extra={}){
  return fetch(url,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:adminKey,...extra})
  }).then(r=>r.json());
}

async function loadStats(){
  const d=await adPost('/api/admin/stats');
  if(!d.success) return;
  document.getElementById('st-users').textContent=d.total_users.toLocaleString('id-ID');
  document.getElementById('st-trx').textContent=d.total_trx.toLocaleString('id-ID');
  document.getElementById('st-income').textContent='Rp '+fmtN(d.total_income);
  document.getElementById('st-dep').textContent='Rp '+fmtN(d.total_deposit);
  document.getElementById('st-bal').textContent='Rp '+fmtN(d.total_balance);
  document.getElementById('st-pend').textContent=d.pending_trx;
}

async function loadUsers(){
  const d=await adPost('/api/admin/users');
  const tb=document.getElementById('user-tbody');
  if(!d.success){tb.innerHTML='<tr><td colspan="6" class="empty">Gagal memuat</td></tr>';return;}
  if(!d.data.length){tb.innerHTML='<tr><td colspan="6" class="empty">Belum ada user</td></tr>';return;}
  tb.innerHTML=d.data.sort((a,b)=>(b.balance||0)-(a.balance||0)).map(u=>`
    <tr>
      <td><strong>@${u.username}</strong></td>
      <td>${u.fullname}</td>
      <td style="font-weight:700;color:var(--primary-light)">Rp ${fmtN(u.balance||0)}</td>
      <td>${u.phone}</td>
      <td style="font-size:.75rem;color:var(--muted)">${fmtDate(u.created_at)}</td>
      <td><button class="btn-sm btn-danger" onclick="delUser('${u.username}')">Hapus</button></td>
    </tr>`).join('');
}

async function topupUser(){
  const username=document.getElementById('tu-user').value.trim();
  const amount=parseInt(document.getElementById('tu-amount').value);
  const msg=document.getElementById('msg-topup');
  if(!username||!amount){showPanelMsg('msg-topup','Isi semua field!','error');return;}
  const d=await adPost('/api/admin/topup-balance',{username,amount});
  showPanelMsg('msg-topup',d.message,d.success?'success':'error');
  if(d.success){loadUsers();loadStats();}
}

async function delUser(username){
  if(!confirm(`Yakin hapus user @${username}? Semua data akan hilang.`)) return;
  const d=await adPost('/api/admin/delete-user',{username});
  alert(d.message);
  loadUsers();
}

async function loadTrx(){
  const d=await adPost('/api/admin/transactions');
  const tb=document.getElementById('trx-tbody');
  if(!d.success){tb.innerHTML='<tr><td colspan="7" class="empty">Gagal memuat</td></tr>';return;}
  if(!d.data.length){tb.innerHTML='<tr><td colspan="7" class="empty">Belum ada transaksi</td></tr>';return;}
  tb.innerHTML=d.data.map(t=>{
    const isD=t.type==='deposit';
    const typeBadge=`<span class="badge ${isD?'badge-dep':'badge-nokos'}">${isD?'Deposit':'Nokos'}</span>`;
    const statBadge=`<span class="badge ${t.status==='success'?'badge-s':t.status==='pending'?'badge-p':'badge-c'}">${t.status}</span>`;
    const info=t.product_data?.nomor?`📱 ${t.product_data.nomor}`:(t.product_data?.layanan_nama||'—');
    return `<tr>
      <td style="font-size:.73rem;color:var(--muted)">${t.order_id}</td>
      <td>@${t.username}</td>
      <td>${typeBadge}</td>
      <td style="font-weight:700;color:var(--primary-light)">Rp ${fmtN(t.amount||0)}</td>
      <td>${statBadge}</td>
      <td style="font-size:.78rem">${info}</td>
      <td style="font-size:.75rem;color:var(--muted)">${fmtDate(t.date)}</td>
    </tr>`;
  }).join('');
}

function showPanelMsg(id,text,type){
  const el=document.getElementById(id);
  el.textContent=text; el.className='msg-panel '+type; el.style.display='block';
}
function fmtN(n){return Number(n).toLocaleString('id-ID');}
function fmtDate(d){return new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});}

document.addEventListener('keypress',e=>{if(e.key==='Enter')adminLogin();});
</script>
</body>
</html>
