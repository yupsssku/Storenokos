<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar - NokosStore</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{background:#1a1a2e;border:1px solid #7c3aed33;border-radius:20px;padding:40px;width:100%;max-width:420px;margin:20px}
    .logo{text-align:center;font-size:1.8rem;font-weight:800;color:#7c3aed;margin-bottom:8px}
    .subtitle{text-align:center;color:#9ca3af;font-size:.9rem;margin-bottom:30px}
    .form-group{margin-bottom:18px}
    label{display:block;color:#a855f7;font-size:.85rem;font-weight:600;margin-bottom:6px}
    input{width:100%;padding:12px 15px;background:#0f0f1a;border:1px solid #7c3aed44;border-radius:10px;color:#e0e0e0;font-size:.95rem;outline:none;transition:border .2s}
    input:focus{border-color:#7c3aed}
    .btn{width:100%;padding:13px;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:5px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 5px 20px #7c3aed55}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .msg{padding:12px;border-radius:10px;margin-top:15px;text-align:center;font-size:.9rem;display:none}
    .msg.success{background:#14532d22;border:1px solid #16a34a44;color:#4ade80}
    .msg.error{background:#450a0a22;border:1px solid #dc262644;color:#f87171}
    .link{text-align:center;margin-top:20px;color:#9ca3af;font-size:.9rem}
    .link a{color:#7c3aed;text-decoration:none}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">⚡ NokosStore</div>
  <div class="subtitle">Buat akun baru</div>

  <div class="form-group">
    <label>Nama Lengkap</label>
    <input type="text" id="fullname" placeholder="Nama kamu"/>
  </div>
  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="username (huruf kecil)"/>
  </div>
  <div class="form-group">
    <label>Nomor HP (WhatsApp)</label>
    <input type="text" id="phone" placeholder="08xxxxxxxxxx"/>
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Minimal 6 karakter"/>
  </div>

  <button class="btn" id="btn-register" onclick="doRegister()">Daftar Sekarang</button>

  <div class="msg" id="msg"></div>
  <div class="link">Sudah punya akun? <a href="/login">Login</a></div>
</div>

<script>
async function doRegister() {
  const btn = document.getElementById('btn-register');
  const msg = document.getElementById('msg');
  const fullname = document.getElementById('fullname').value.trim();
  const username = document.getElementById('username').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;

  if (!fullname || !username || !phone || !password) {
    showMsg('Semua field wajib diisi!', 'error'); return;
  }

  btn.disabled = true;
  btn.textContent = 'Mendaftar...';

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ fullname, username, phone, password })
    });
    const data = await res.json();
    if (data.success) {
      showMsg('Berhasil! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/login', 1500);
    } else {
      showMsg(data.message, 'error');
    }
  } catch {
    showMsg('Error koneksi server', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Daftar Sekarang';
}

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
  msg.style.display = 'block';
}
</script>
</body>
</html>
